<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff4f7;
      color: #333;
    }

    .box {
      max-width: 500px;
      margin: 70px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #e75480;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    textarea {
      height: 180px;
      resize: vertical;
    }

    button {
      background: #e75480;
      color: white;
      border: none;
      cursor: pointer;
    }

    #letterPage {
      display: none;
    }

    .saved {
      margin-top: 20px;
      padding: 15px;
      background: #fff0f4;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="box" id="loginPage">
    <h1>Letter</h1>

    <input type="text" id="name" placeholder="Name">
    <input type="password" id="password" placeholder="Password">

    <button onclick="enterLetter()">Open Letter</button>

    <p class="error" id="error"></p>
  </div>

  <div class="box" id="letterPage">
    <h1>Letter</h1>

    <textarea id="letterText" placeholder="Write your letter here..."></textarea>

    <button onclick="saveLetter()">Save Letter</button>

    <div id="savedLetters"></div>
  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBkfLCgb8eVtFyEBfsnnQcsCpuesaAF4k",
      authDomain: "rihma-letter.firebaseapp.com",
      projectId: "rihma-letter",
      storageBucket: "rihma-letter.firebasestorage.app",
      messagingSenderId: "615157104479",
      appId: "1:615157104479:web:cd4dd4789f160900d3c0ea",
      measurementId: "G-ZF2WZXCNMM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const correctName = "rihma letter";
    const correctPassword = "rihana";

    function enterLetter() {
      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;

      if (name === correctName && password === correctPassword) {

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("letterPage").style.display = "block";

        showLetters();

      } else {
        document.getElementById("error").innerText =
          "Wrong name or password";
      }
    }

    window.enterLetter = enterLetter;

    async function saveLetter() {
      const text = document.getElementById("letterText").value.trim();

      if (!text) {
        alert("Please write a letter first");
        return;
      }

      try {

        await addDoc(collection(db, "letters"), {
          text: text,
          date: new Date().toLocaleString()
        });

        document.getElementById("letterText").value = "";

        showLetters();

      } catch (error) {
        console.error(error);
        alert("Letter save aagala. Please try again.");
      }
    }

    window.saveLetter = saveLetter;

    async function showLetters() {

      const container = document.getElementById("savedLetters");

      container.innerHTML = "Loading letters...";

      try {

        const q = query(
          collection(db, "letters"),
          orderBy("date")
        );

        const snapshot = await getDocs(q);

        container.innerHTML = "";

        let index = 1;

        snapshot.forEach((doc) => {

          const letter = doc.data();

          container.innerHTML += `
            <div class="saved">
              <b>Letter ${index}</b><br>
              <small>${escapeHtml(letter.date || "")}</small>
              <br><br>
              ${escapeHtml(letter.text || "")}
            </div>
          `;

          index++;

        });

      } catch (error) {

        console.error(error);

        container.innerHTML =
          "<p class='error'>Letters load aagala.</p>";
      }
    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

  </script>

</body>
</html>
