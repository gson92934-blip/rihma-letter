<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff4f7;
      color: #333;
    }

    .box {
      max-width: 500px;
      margin: 70px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #e75480;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    textarea {
      height: 180px;
      resize: vertical;
    }

    button {
      background: #e75480;
      color: white;
      border: none;
      cursor: pointer;
    }

    #letterPage {
      display: none;
    }

    .saved {
      margin-top: 20px;
      padding: 15px;
      background: #fff0f4;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="box" id="loginPage">
    <h1>💌 Letter</h1>

    <input type="text" id="name" placeholder="Name">
    <input type="password" id="password" placeholder="Password">

    <button onclick="enterLetter()">Open Letter</button>

    <p class="error" id="error"></p>
  </div>

  <div class="box" id="letterPage">
    <h1>💌 Letter</h1>

    <textarea id="letterText" placeholder="Write your letter here..."></textarea>

    <button onclick="saveLetter()">Save Letter</button>

    <div id="savedLetters"></div>
  </div>

  <script>
    const correctName = "rihma letter";
    const correctPassword = "rihana";

    function enterLetter() {
      const name = document.getElementById("name").value;
      const password = document.getElementById("password").value;

      if (name === correctName && password === correctPassword) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("letterPage").style.display = "block";
        showLetters();
      } else {
        document.getElementById("error").innerText =
          "Wrong name or password";
      }
    }

    function saveLetter() {
      const text = document.getElementById("letterText").value.trim();

      if (!text) {
        alert("Please write a letter first ❤️");
        return;
      }

      let letters = JSON.parse(localStorage.getItem("letters") || "[]");

      letters.push({
        text: text,
        date: new Date().toLocaleString()
      });

      localStorage.setItem("letters", JSON.stringify(letters));

      document.getElementById("letterText").value = "";
      showLetters();
    }

    function showLetters() {
      const container = document.getElementById("savedLetters");
      const letters = JSON.parse(localStorage.getItem("letters") || "[]");

      container.innerHTML = "";

      letters.forEach((letter, index) => {
        container.innerHTML += `
          <div class="saved">
            <b>Letter ${index + 1}</b><br>
            <small>${letter.date}</small>
            <br><br>
            ${escapeHtml(letter.text)}
          </div>
        `;
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
